# Render.com blueprint.
#
# Deploy: on Render, click "New > Blueprint", connect this repo, Apply.
# Render auto-generates BOTH app secrets (JWT_SECRET, PHI_ENCRYPTION_KEY),
# so the ONLY thing you provide is a free Turso database (cloud SQLite):
#
#   curl -sSfL https://get.tur.so/install.sh | bash && turso auth signup
#   turso db create oncoconnect
#   turso db show oncoconnect --url        # -> TURSO_DATABASE_URL
#   turso db tokens create oncoconnect     # -> TURSO_AUTH_TOKEN
#
# Paste those two values when Render prompts (marked sync:false below).
# Full walkthrough + a no-Turso (persistent-disk) alternative: DEPLOY_VERCEL.md.
services:
  - type: web
    name: oncoconnect-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Both secrets are generated by Render — nothing to paste, nothing to
      # format. PHI_ENCRYPTION_KEY accepts any strong secret (see config.js:
      # a 64-hex value is used as-is, anything else is SHA-256-derived).
      - key: JWT_SECRET
        generateValue: true
      - key: PHI_ENCRYPTION_KEY
        generateValue: true
      # Free cloud database — the only two values you supply.
      - key: TURSO_DATABASE_URL
        sync: false                  # libsql://<db>-<org>.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false

# ── Alternative: no Turso, use a persistent disk (needs a paid Starter plan) ──
# Set the service's plan to `starter`, delete the two TURSO_* vars, and add:
#   envVars:
#     - key: DB_PATH
#       value: /var/data/chemocure.db
#   disk:
#     name: oncoconnect-data
#     mountPath: /var/data
#     sizeGB: 1
# Both app secrets still auto-generate and no external DB is needed.
