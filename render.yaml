# Render.com blueprint for OncoConnect.
#
# Deploy: on Render, click "New > Blueprint", connect this repo, Apply.
# Render auto-generates app secrets (JWT_SECRET, PHI_ENCRYPTION_KEY).
#
# DATABASE OPTIONS:
#
# Option 1: Free (Turso cloud SQLite) — RECOMMENDED for production
#   1. Create a free Turso database: https://turso.tech
#   2. turso db create oncoconnect
#   3. turso db tokens create oncoconnect
#   4. Copy the URL and token below
#
# Option 2: Free (SQLite file, ephemeral) — for testing/preview only
#   No setup needed; runs in memory, resets on redeploy
#   To use: uncomment DB_EPHEMERAL line below
#
# QUICK START (using Turso):
#   1. Sign up: https://turso.tech (free tier is generous)
#   2. turso db create oncoconnect
#   3. turso db show oncoconnect --url  → copy the URL
#   4. turso db tokens create oncoconnect → copy the token
#   5. Paste them below when Render prompts
services:
  - type: web
    name: oncoconnect-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Secrets auto-generated by Render (no setup needed)
      - key: JWT_SECRET
        generateValue: true
      - key: PHI_ENCRYPTION_KEY
        generateValue: true

      # DATABASE (choose one of the below options):

      # Option A: Turso (cloud SQLite, FREE, recommended for production)
      # Get these from: turso db show oncoconnect --url, turso db tokens create oncoconnect
      - key: TURSO_DATABASE_URL
        sync: false                  # e.g., libsql://onco-xyz.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false

      # Option B: Ephemeral SQLite (FREE, for testing/preview)
      # Uncomment the line below to test WITHOUT Turso setup.
      # WARNING: data is lost on every redeploy. DO NOT use for production.
      # - key: DB_EPHEMERAL
      #   value: "true"

# ── Alternative: no Turso, use a persistent disk (needs a paid Starter plan) ──
# Set the service's plan to `starter`, delete the two TURSO_* vars, and add:
#   envVars:
#     - key: DB_PATH
#       value: /var/data/chemocure.db
#   disk:
#     name: oncoconnect-data
#     mountPath: /var/data
#     sizeGB: 1
# Both app secrets still auto-generate and no external DB is needed.
